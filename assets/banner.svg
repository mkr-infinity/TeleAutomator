<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glowCyan" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2AABEE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2AABEE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Telegram Brand Gradient -->
    <linearGradient id="tgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2AABEE"/>
      <stop offset="100%" stop-color="#229ED9"/>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.2"/>
      <circle cx="40" cy="0" r="1.5" fill="#38BDF8" fill-opacity="0.3"/>
    </pattern>

    <!-- Filter for drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="420" fill="url(#bgGrad)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="240" cy="180" r="320" fill="url(#glowCyan)"/>
  <circle cx="1060" cy="160" r="380" fill="url(#glowIndigo)"/>
  <circle cx="640" cy="380" r="260" fill="url(#glowPurple)"/>

  <!-- Outer Border Frame -->
  <rect x="2" y="2" width="1276" height="416" rx="20" fill="none" stroke="#1E293B" stroke-width="2" stroke-opacity="0.6"/>

  <!-- LEFT: Hero App Icon Glass Container -->
  <g transform="translate(80, 80)" filter="url(#shadow)">
    <!-- Icon Container Box -->
    <rect x="0" y="0" width="170" height="170" rx="38" fill="url(#cardBg)" stroke="url(#pillBorder)" stroke-width="2"/>
    
    <!-- Telegram Disc -->
    <circle cx="85" cy="85" r="58" fill="url(#tgGrad)"/>
    
    <!-- Stylized Telegram Paper Plane -->
    <path d="M 54 83 L 112 59 C 115 57 118 60 117 63 L 105 113 C 104 116 100 117 98 115 L 85 102 L 77 110 C 76 111 74 111 74 109 L 75 97 L 102 73 C 103 72 101 71 100 72 L 67 92 L 56 87 C 53 86 53 83 56 82 Z" fill="#FFFFFF"/>
    
    <!-- AI Sparkle Orb (top right corner of icon) -->
    <circle cx="140" cy="30" r="16" fill="#0D1527" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 140 21 L 142 27 L 148 29 L 142 31 L 140 37 L 138 31 L 132 29 L 138 27 Z" fill="#38BDF8"/>
  </g>

  <!-- RIGHT: Typography & Content -->
  <g transform="translate(290, 85)">
    <!-- Top Meta Row: Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="30" rx="15" fill="#1E293B" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.5"/>
      <circle cx="16" cy="15" r="4.5" fill="#10B981"/>
      <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" letter-spacing="0.5">TELEAUTOMATOR v2.0</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">TeleAutomator</text>

    <!-- Tagline Subtitle -->
    <text x="2" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#94A3B8">Production-Grade Telegram User Account Automation with AI</text>

    <!-- Feature Highlights Pills -->
    <g transform="translate(0, 160)">
      <!-- Pill 1: MTProto -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="170" height="36" rx="10" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.2"/>
        <text x="18" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">⚡ MTProto Telethon</text>
      </g>

      <!-- Pill 2: Permanent Context -->
      <g transform="translate(182, 0)">
        <rect x="0" y="0" width="200" height="36" rx="10" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.2"/>
        <text x="18" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#A78BFA">🧠 Permanent Context</text>
      </g>

      <!-- Pill 3: Anti-Spam Guardrails -->
      <g transform="translate(394, 0)">
        <rect x="0" y="0" width="195" height="36" rx="10" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.2"/>
        <text x="18" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#34D399">🛡️ Human-Like Delays</text>
      </g>

      <!-- Pill 4: Cloud Ready -->
      <g transform="translate(601, 0)">
        <rect x="0" y="0" width="180" height="36" rx="10" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.2"/>
        <text x="18" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F472B6">☁️ Railway &amp; VPS 24/7</text>
      </g>
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(80, 360)">
    <line x1="0" y1="0" x2="1120" y2="0" stroke="#1E293B" stroke-width="1.5"/>
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">
      Developed by <tspan fill="#38BDF8" font-weight="600">Mohammad Kaif Raja (@mkr-infinity)</tspan>
    </text>
    <text x="1120" y="28" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">
      Coffee: <tspan fill="#F59E0B">buymeacoffee.com/mkr_infinity</tspan>  •  UPI: <tspan fill="#10B981">mkr-infinity@ybl</tspan>
    </text>
  </g>
</svg>
