services:
  - type: web
    name: teleautomator
    runtime: docker
    # Before applying: explicitly choose a service plan and persistent disk.
    # No disk or paid plan is provisioned by this template.
    healthCheckPath: /
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: REQUIRE_PERSISTENT_STORAGE
        value: "true"
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_SESSION_MODE
        value: string
      - key: TG_SESSION_STRING
        sync: false
      - key: AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
      - key: REPLY_MODE
        value: restricted_auto
      - key: AUTO_AUTHORIZE
        value: "true"
      - key: MIN_REPLY_DELAY_SECONDS
        value: "5"
      - key: MAX_REPLY_DELAY_SECONDS
        value: "60"
      - key: TYPING_DELAY_SECONDS
        value: "2"
