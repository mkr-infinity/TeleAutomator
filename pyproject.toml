[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-personal-client"
version = "1.0.0"
description = "Secure Personal Telegram MTProto Client with Local and Cloud Deployment"
authors = [{ name = "Kaif" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.36.0,<2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
