services:
  teleautomator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teleautomator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      REQUIRE_PERSISTENT_STORAGE: "true"
    ports:
      - "8080:8080"
    volumes:
      # Named volume: Docker creates it and the entrypoint fixes its ownership, so it survives
      # rebuilds and never touches your host ./data folder or its file permissions.
      - app_data:/app/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_data:
    driver: local
