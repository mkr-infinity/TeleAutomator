services:
  telegram-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-client
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - app_data:/app/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_data:
    driver: local
